[project]
name = "azure-api-learning"
version = "0.1.0"
description = "A beginner-friendly FastAPI project for learning APIs and Azure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11,<4.0",
    "azure-data-tables>=12.7,<13.0",
    "azure-functions>=1.24,<2.0",
    "azure-identity>=1.24,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
